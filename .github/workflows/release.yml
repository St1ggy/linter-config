name: Release

on:
  workflow_dispatch:
    inputs:
      release_as:
        description: Exact version to release when there are no user-facing commits, for example 7.1.1
        required: false
        type: string
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.release_as }}
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          node-version: latest
          cache: npm
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: npm ci
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: npx prettier --write CHANGELOG.md
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: npm run lint
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "style: format generated changelog"
          git push

  release-cancelled:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == false && startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Release PR was closed without merging; no release or npm publication was created.'

  finalize-and-publish:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
          cache: npm
      - if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm ci
      - if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npx prettier --check CHANGELOG.md
      - if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm run lint
      - if: ${{ steps.release.outputs.release_created == 'true' }}
        run: npm publish --access public --provenance
