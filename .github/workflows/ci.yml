name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test scripts/solid-config.test.mjs
      - run: npx tsc --noEmit
      - run: npm pack --dry-run
